<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="mask-icon" href="/logo.svg" color="#B84A32" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="PureWire — say it anyway. A social platform built around expression, connection, and freedom — not advertising or corporate sponsorships. Every post verified original, no algorithms, no ads." />
  <meta name="keywords" content="PureWire, say it anyway, free speech, social network, no algorithms, no ads, original content, independent creators, verified profiles" />
  <meta name="theme-color" content="#171918" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="%VITE_SITE_URL%" />

  <!-- PWA install / mobile-web-app presentation -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PureWire" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PureWire" />
  <meta property="og:title" content="PureWire — Say it anyway." />
  <meta property="og:description" content="A social platform built around expression, connection, and freedom — not advertising or corporate sponsorships. Every post verified original, no algorithms, no ads." />
  <meta property="og:url" content="%VITE_SITE_URL%" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PureWire — say it anyway. A social platform built around expression, connection, and freedom." />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PureWire — Say it anyway." />
  <meta name="twitter:description" content="A social platform built around expression, connection, and freedom — not advertising or corporate sponsorships. Every post verified original, no algorithms, no ads." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

  <title>PureWire — Say it anyway.</title>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "PureWire",
    "url": "%VITE_SITE_URL%",
    "description": "A social platform built around expression, connection, and freedom — every post verified original, no algorithms, no ads."
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
