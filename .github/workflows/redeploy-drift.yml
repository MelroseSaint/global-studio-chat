name: Redeploy on drift

# Nightly safety net for the canonical/env state: if the commit LIVE on
# Vercel production (the newest READY production deployment's
# githubCommitSha) has drifted from main's HEAD — a manual dashboard
# redeploy of an older commit, a push deploy that silently failed, or a
# deploy that never happened — redeploy from the repo so the live site can
# never silently lag the repo. When they match, this is a no-op.
#
# The drift check runs scripts/vercel-drift-check.mjs, which prints
# `drifted=true|false`; the deploy step below is skipped unless drifted.
# The check exits 0 in both states and only fails on an API/check error,
# so an outage never triggers an accidental redeploy.
#
# The same guard now covers the Convex backend (redeploy-convex-if-drifted
# job): migrations.yml records the deployed git commit after every
# successful `convex deploy`, and this job compares that record against
# main HEAD — re-running `convex deploy` when they drift, so a silently
# failed migrations deploy can never leave the backend behind the repo.
on:
  schedule:
    # 03:47 UTC — after the nightly healthcheck (03:00) has validated the
    # previous deploy, and safely outside usual push hours. GitHub runs
    # cron on the default branch; GITHUB_SHA is main's HEAD.
    - cron: "47 3 * * *"
  workflow_dispatch: {}

# Same concurrency group as the Deploy workflow so a drift redeploy and a
# push-triggered deploy never race the same Vercel project — one waits
# for the other (cancel-in-progress: false). The Convex job in this
# workflow shares this group too (job-level concurrency isn't supported),
# so a Vercel drift deploy and a Convex drift deploy serialize rather than
# racing.
#
# Note this does NOT serialize against the migrations workflow (which uses
# its own `convex-migrations` group): a drift deploy at 03:47 and the
# nightly migrations deploy at 04:00 could in principle overlap. That is
# safe by construction — the Convex push protocol rejects concurrent
# pushes (the later one fails cleanly, and the drift guard re-checks
# nightly), and migrations.yml runs `convex deploy` on every push to main
# anyway, so convergence is guaranteed within one night either way.
concurrency:
  group: deploy-vercel
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open/close the deduplicated drift-check alert issue

jobs:
  redeploy-if-drifted:
    name: Redeploy production if drifted from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Expose the drift verdict so the mirror-sync job below only builds
    # when a redeploy actually happened (the nightly no-op path stays a
    # no-op instead of rebuilding and re-uploading identical files).
    outputs:
      drifted: ${{ steps.drift.outputs.drifted }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Compares the live production commit against GITHUB_SHA (main HEAD)
      # and writes drifted=true|false to $GITHUB_OUTPUT. The checkout is
      # main HEAD, so a triggered redeploy always ships the repo state.
      - name: Compare live commit vs main HEAD
        id: drift
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_S3b0Y2fnJhOo8sdP39P0zfGP
          VERCEL_PROJECT_ID: prj_Y8sMe7X0RLGsMWa0tcMi8auuNpXa
        run: node scripts/vercel-drift-check.mjs

      # Identical command to the Deploy workflow's production step, so a
      # drift redeploy behaves exactly like a normal push deploy (same
      # verified-email validation, same --scope target).
      - name: Deploy to production (only when drifted)
        if: steps.drift.outputs.drifted == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_S3b0Y2fnJhOo8sdP39P0zfGP
          VERCEL_PROJECT_ID: prj_Y8sMe7X0RLGsMWa0tcMi8auuNpXa
        run: npx --yes vercel@latest --prod --yes --scope team_S3b0Y2fnJhOo8sdP39P0zfGP

      - name: Note the redeploy
        if: steps.drift.outputs.drifted == 'true'
        run: echo "Production redeployed to main HEAD — the live commit now matches the repo."

  sync-mirror-if-drifted:
    # Mirror twin of the drift redeploy. A drift redeploy ships the same
    # commit the push path ships, so the convex.site mirror must follow it
    # too — otherwise the nightly drift path would re-create the exact
    # mirror lag the deploy workflow's sync job exists to prevent. Runs
    # ONLY when the drift check said drifted AND the redeploy succeeded
    # (needs guarantees the latter); the no-op night builds nothing.
    name: Sync the convex.site mirror when production was redeployed
    needs: [redeploy-if-drifted]
    if: needs.redeploy-if-drifted.outputs.drifted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      # A missing deploy key would silently lag the mirror — a loud
      # failure here, not a skip (same rationale as deploy.yml).
      - name: Verify the deploy key is configured
        if: env.CONVEX_DEPLOY_KEY == ''
        run: |
          echo "::error::CONVEX_DEPLOY_KEY is not set — the convex.site mirror cannot be synced and WILL lag the main host. Add it as a repo secret and re-run this job."
          exit 1

      - name: Publish dist to the static-hosting component
        run: node scripts/upload-static-sync.mjs --prod

      # Same deduplicated-alert pattern as deploy.yml's sync job (shared
      # label prod-mirror-sync), so a failure on EITHER deploy route opens
      # one visible issue instead of two competing alerts.
      - name: Alert on sync failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-mirror-sync";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly drift redeploy" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `convex.site mirror sync failed (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The convex.site mirror sync failed after a drift redeploy.",
                "",
                "The mirror (outgoing-seal-727.convex.site) must match the main",
                "host — when this job fails, the mirror silently lags and serves",
                "an older UI (the admin-dropdown incident was exactly this).",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Fix the cause and re-run the job (or push again). You can also",
                "sync manually: `npm run build && node scripts/upload-static-sync.mjs",
                "--prod`. This issue is closed automatically on the next",
                "successful sync from either deploy route.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-mirror-sync";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open mirror-sync alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed mirror-sync alert issue #${issue.number}.`);
            }

  redeploy-convex-if-drifted:
    # Backend twin of the Vercel drift guard. Convex exposes no commit
    # metadata to a deploy key, so migrations.yml records the deployed git
    # commit (internal.deployStatus.recordDeploy) right after every
    # successful deploy; this job reads it back (convex-drift-check.mjs,
    # via `convex run internal.deployStatus.getDeployedSha`) and compares
    # against GITHUB_SHA (main HEAD). Drift — a silently failed migrations
    # deploy, a dashboard redeploy of an older commit, a deploy that never
    # happened — triggers `convex deploy` + a re-record, so the backend can
    # never silently lag the repo. Skips when CONVEX_DEPLOY_KEY is not
    # configured.
    name: Redeploy Convex backend if drifted from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npm ci

      # Reads the recorded deploy commit via convex run and writes
      # drifted=true|false to $GITHUB_OUTPUT. Exit 0 in both states; only a
      # check error fails, so an outage can never trigger an accidental
      # deploy. A backend with no record yet (predates deployStatus) reads
      # as drifted and gets deployed to establish the ledger.
      - name: Compare live backend commit vs main HEAD
        if: env.CONVEX_DEPLOY_KEY != ''
        id: drift
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: node scripts/convex-drift-check.mjs

      - name: Deploy the backend (only when drifted)
        if: steps.drift.outputs.drifted == 'true' && env.CONVEX_DEPLOY_KEY != ''
        id: deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      # A drift deploy can ship schema/code that carries pending migrations
      # (the very case this guard exists for — a migrations deploy that
      # silently failed). runAllMigrations is idempotent and deploy-key
      # callable, so run it after the deploy to close the loop instead of
      # waiting for the 04:00 nightly run.
      - name: Run pending migrations (if any)
        if: steps.deploy.conclusion == 'success' && env.CONVEX_DEPLOY_KEY != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run internal.migrationsRunner.runAllMigrations

      # Re-establish the ledger after a drift deploy, exactly as
      # migrations.yml does, so the next nightly comparison is meaningful.
      - name: Record the redeployed commit
        if: steps.deploy.conclusion == 'success' && env.CONVEX_DEPLOY_KEY != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run internal.deployStatus.recordDeploy "{\"sha\":\"$GITHUB_SHA\"}"

      # The drift check exits 0 in BOTH sync and drift states — it only
      # fails when the check itself is broken (deploy key rejected, CLI
      # crash, unexpected error). A red job from the check alone is
      # otherwise silent: the deploy step is skipped (no drifted output)
      # and nothing alerts. Open a deduplicated issue (label
      # prod-convex-drift-check) so a broken check can't red the nightly
      # without a trace — same pattern as migrations.yml's prod-migrations.
      #
      # Gate: alert whenever the job failed AND the drift step did not pass
      # — i.e. the check failed, or a prior step failed before the check
      # could run (npm ci, setup). A failed DEPLOY (check passed, redeploy
      # failed) stays out of this alert's scope: the check itself is
      # healthy, and migrations.yml's own nightly deploy + prod-migrations
      # alert covers backend deploy failures. When CONVEX_DEPLOY_KEY is
      # unset the drift step is skipped but the job succeeds, so `failure()`
      # keeps the alert quiet there, matching the migrations convention.
      - name: Alert on drift check failure
        if: failure() && steps.drift.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-convex-drift-check";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Convex drift check failed (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The Convex backend drift guard failed against production.",
                "",
                "The drift check (scripts/convex-drift-check.mjs, via `convex run`",
                "internal.deployStatus.getDeployedSha) exits 0 in both sync and",
                "drift states, so this failure means the guard itself is broken —",
                "e.g. a rejected/missing CONVEX_DEPLOY_KEY, a CLI crash, an",
                "unexpected error, or a setup/install failure before the check",
                "could run. The backend drift guard is now blind: drift cannot be",
                "detected until this is fixed.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Run the drift workflow manually after fixing to confirm the check",
                "recovers. This issue is closed automatically on the next passing",
                "check.",
              ].join("\n"),
            });

      # Close semantics are check-scoped too: the alert exists only while
      # the CHECK is broken. If the check passes but a drift deploy failed
      # that same night, the alert is closed (the check recovered) and the
      # deploy failure surfaces through the red run + prod-migrations.
      - name: Close stale alert on check pass
        if: steps.drift.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-convex-drift-check";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open drift-check alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed drift-check alert issue #${issue.number}.`);
            }

      - name: Note the backend redeploy
        if: steps.drift.outputs.drifted == 'true'
        run: echo "Convex backend redeployed to main HEAD — the live commit now matches the repo."
