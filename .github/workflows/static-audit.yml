name: Static Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:secrets

  dqs-audit:
    name: DQS data-integrity audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run DQS audit against production
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
        run: npm run qa:count-drift

  racism-qa:
    name: Racism prevention QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:racism

  phishing-qa:
    name: Phishing & prohibited-domain QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:phishing

  blocklist-qa:
    name: Blocklist engine QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:blocklist

  ai-scan-qa:
    name: AI content scan QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:ai-scan

  automation-qa:
    name: Automation detector QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:automation

  ai-scan-integration:
    name: AI scan integration QA (harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ secrets.TEST_HARNESS_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run upload→scan→evidence pipeline test
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
        run: npm run qa:ai-scan-integration

  salt-qa:
    name: Salt rotation QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:salt

  admin-responsive-qa:
    name: Admin responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The browser QAs sign in on production with the admin password. When
    # the secret isn't configured the job SKIPS cleanly (green) instead of
    # failing every push — same gate the original single-job design used.
    if: ${{ secrets.ADMIN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the admin dashboard responsive QA
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://purewire.vercel.app' }}
        run: npm run qa:admin-responsive

  pages-inflation-qa:
    name: Page inflation QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ secrets.ADMIN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the dense-page inflation QA
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://purewire.vercel.app' }}
        run: npm run qa:pages-inflation

  shadowban-qa:
    name: Silent moderation QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test shadowban lifecycle against production
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
        run: npm run qa:shadowban

  reinstate-qa:
    name: Admin reinstatement QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test admin reinstatement workflow against production
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
        run: npm run qa:reinstate

  cloudinary-health:
    name: Cloudinary health probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe Cloudinary upload pipeline
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm run qa:cloudinary-health

  session-audit:
    name: Session lifetime audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit session lifetimes
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
        run: npm run qa:session-audit

  cleanup-test-users:
    name: Sweep leftover QA users
    runs-on: ubuntu-latest
    needs:
      - dqs-audit
      - phishing-qa
      - blocklist-qa
      - ai-scan-integration
      - shadowban-qa
      - reinstate-qa
      - cloudinary-health
      - session-audit
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Erase leftover QA test users from production
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
        run: npm run qa:cleanup-test-users
