name: Deploy to Vercel

# Ship the frontend to Vercel production on every push to `main` and on
# manual dispatch. The build runs inside the runner (tsc + vite via the
# buildCommand in vercel.json) and the finished artifacts are uploaded with
# `--prebuilt`, so what CI built is exactly what goes live. The Static Audit
# workflow runs in parallel on the same push; its own `npm run build` is the
# hard gate here — a commit that fails to compile never reaches Vercel.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  # One deploy at a time — a newer push waits for the previous to finish.
  group: deploy-vercel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    # Cold runners are slow: npm ci + vercel build (tsc + vite) plus the
    # upload routinely exceed 20 minutes on the first run after a cache
    # miss, so give the deploy headroom to finish.
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production

      - name: Build for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes
