name: Run Convex migrations

# Deploys the Convex backend to production and runs every registered
# migration (see convex/migrationsRunner.ts) in order. Runs on every push
# to `main` — so schema backfills ship the moment code ships — plus once a
# night to catch anything a push missed, and manually from the Actions tab.
#
# The migration runner is the only place the workflow cares about:
# `runAllMigrations` walks the registered steps in code, so adding a new
# migration never requires editing this file.
#
# Requires the CONVEX_DEPLOY_KEY secret (a project deploy key from the
# Convex dashboard: Settings → Access tokens → Deploy). The job is skipped
# on repositories that haven't configured it yet.
on:
  push:
    branches:
      - main
  schedule:
    # 04:00 UTC — an hour after the production health check (03:00) so the
    # deployment is known-good before migrations touch the data.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  # Never overlap runs: migrations are idempotent but two simultaneous
  # deploys would race each other.
  group: convex-migrations
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open a deduplicated alert issue when a migration fails
  administration: write # flip the MEDIA_MODE_EXPECTATION repo variable after the env sync

jobs:
  migrate:
    name: Deploy + run migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `secrets` is rejected in `if:` expressions — map to an env var.
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sync the Cloudinary env onto the deployment from the repo secrets
      # (when configured) so the media pipeline's Cloudinary mode is
      # env-driven from CI — the flip needs no code change, and the values
      # never appear in chat or logs. Only sets what the repo actually
      # holds; a missing secret is skipped, not an error. `--prod` mirrors
      # `npx convex deploy`'s default targeting under a deploy key; values
      # come AFTER the flag (commander gotcha, see ensure-jwt-keys.mjs).
      - name: Sync Cloudinary env from repo secrets
        if: env.CONVEX_DEPLOY_KEY != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -n "$CLOUDINARY_CLOUD_NAME" ]; then
            npx convex env set --prod CLOUDINARY_CLOUD_NAME "$CLOUDINARY_CLOUD_NAME"
          fi
          if [ -n "$CLOUDINARY_API_KEY" ]; then
            npx convex env set --prod CLOUDINARY_API_KEY "$CLOUDINARY_API_KEY"
          fi
          if [ -n "$CLOUDINARY_API_SECRET" ]; then
            npx convex env set --prod CLOUDINARY_API_SECRET "$CLOUDINARY_API_SECRET"
          fi

      # Complete the media flip automatically: once all three Cloudinary
      # vars are live on the deployment (env list confirms), flip the
      # MEDIA_MODE_EXPECTATION repo variable so the Media architecture
      # guard verifies the new mode on the same run. Ordered so the
      # expectation never leads the capability — if the sync failed, the
      # variable stays `convex` and the guard stays honest. Rotating the
      # stale CONVEX_DEPLOY_KEY is therefore the ONLY manual step left in
      # docs/media-storage.md's Option A.
      - name: Flip MEDIA_MODE_EXPECTATION after a successful sync
        if: env.CONVEX_DEPLOY_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CLOUDINARY_CLOUD_NAME" ] || [ -z "$CLOUDINARY_API_KEY" ] || [ -z "$CLOUDINARY_API_SECRET" ]; then
            echo "Cloudinary secrets incomplete — expectation stays as-is."
            exit 0
          fi
          export CONVEX_DEPLOY_KEY
          live="$(npx convex env list --prod 2>/dev/null | grep -c '^CLOUDINARY_' || true)"
          if [ "${live:-0}" -lt 3 ]; then
            echo "Only $live/3 CLOUDINARY_* vars live on the deployment — not flipping the expectation."
            exit 0
          fi
          repo="${GITHUB_REPOSITORY}"
          code_create=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/actions/variables" \
            -d '{"name":"MEDIA_MODE_EXPECTATION","value":"cloudinary"}')
          if [ "$code_create" != "201" ]; then
            code_patch=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/variables/MEDIA_MODE_EXPECTATION" \
              -d '{"value":"cloudinary"}')
            echo "variable PATCH: $code_patch"
          else
            echo "variable created: 201"
          fi

      - name: Deploy the backend to production
        if: env.CONVEX_DEPLOY_KEY != ''
        id: deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        # ensure-jwt-keys guarantees the auth stack's JWT_PRIVATE_KEY/JWKS
        # exist before the functions ship: a fresh deployment would otherwise
        # accept the deploy but reject every sign-in with a masked
        # "Missing environment variable JWT_PRIVATE_KEY" (this happened when
        # the production deployment was recreated 2026-09-11). Idempotent —
        # a no-op once the keys are present, never rotates them.
        run: |
          node scripts/ensure-jwt-keys.mjs
          npx convex deploy

      # Record the deployed git commit so the nightly drift job can compare
      # the live backend against main HEAD (Convex exposes no commit
      # metadata to a deploy key — see convex/deployStatus.ts). Runs only
      # when the deploy actually succeeded, so the ledger always reflects
      # what is live, not what was attempted.
      - name: Record the deployed commit
        if: steps.deploy.conclusion == 'success' && env.CONVEX_DEPLOY_KEY != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run internal.deployStatus.recordDeploy "{\"sha\":\"$GITHUB_SHA\"}"

      - name: Run all migrations
        if: env.CONVEX_DEPLOY_KEY != ''
        id: migrate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -o pipefail
          npx convex run internal.migrationsRunner.runAllMigrations 2>&1 | tee migrations.log

      - name: Upload the migration log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migrations-log
          path: migrations.log

      # Alerting: same deduplicated pattern as the other production jobs —
      # a single persistent issue (label prod-migrations) so a failed
      # migration is visible and never silently lost.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-migrations";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Convex migration failed (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The nightly Convex migration run failed against production.",
                "",
                "This means a schema backfill (or the deploy that precedes it) failed —",
                "the data may be in a partially migrated state until it is fixed.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the migrations-log artifact for which step failed. Migrations",
                "are idempotent, so fixing the cause and re-running (or running the",
                "failed step alone via runAllMigrations' `only` arg) converges cleanly.",
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-migrations";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open migration alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed migration alert issue #${issue.number}.`);
            }
