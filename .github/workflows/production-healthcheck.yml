    # Guards the exact crash class that once replaced the whole app with
    # React Router's bare "Unexpected Application Error!" page: the shell
    # fired admin:moderationWorkload before the admin's IP binding was
    # fresh, requireAdmin threw, and Convex 1.30's useQuery THROWS query
    # errors during render — taking down every route. This job mints a real
    # admin session against the LIVE deployment and asserts BOTH halves of
    # the fix (scripts/admin-workload-qa.mjs): (1) the query returns data
    # after a backend IP verification, refuses with a CLEAN ConvexError
    # (never a masked "Server Error") when the binding is aged, and
    # recovers on re-verification; (2) a browser loads /admin with a seeded
    # session and the page stays up — no router error page, no app
    # fallback, the Admin surface renders. Harness-gated like the other QA
    # jobs; runs on the same schedule as the auth loop.
