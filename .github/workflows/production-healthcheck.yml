  robots-live-guard:
    # The search-visibility contract on the LIVE hosts: the mirror's
    # robots.txt must keep disallowing everything (a leaked Allow re-exposes
    # the mirror to Google and can rank it over the canonical host), and the
    # main host's robots.txt must keep its exact canonical Sitemap line (a
    # missing or wrong-host line silently stops the sitemap from being
    # submitted). Both regressions are silent for users — only search engines
    # notice, weeks later — so this zero-dependency guard fails the job and
    # opens a deduplicated alert issue on every push and nightly.
    name: Live robots.txt guard (mirror disallow + main sitemap)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the live robots.txt guard
        env:
          ROBOTS_SITE_URL: ${{ vars.SITE_URL || 'https://purewire.vercel.app' }}
          ROBOTS_MIRROR_URL: ${{ vars.ROBOTS_MIRROR_URL || 'https://outgoing-seal-727.convex.site' }}
          EXPECTED_SITEMAP_HOST: ${{ vars.EXPECTED_SITEMAP_HOST || 'https://purewire.vercel.app' }}
        run: node scripts/robots-live-guard.mjs

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-robots-live";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live robots.txt regression on production (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The live robots.txt contract failed on one of the two hosts:",
                "- the mirror (outgoing-seal-727.convex.site) no longer",
                "  disallows everything, or an Allow line leaked back in —",
                "  Google can crawl and rank the mirror over",
                "  purewire.vercel.app again;",
                "- the main host's robots.txt lost its exact canonical Sitemap",
                "  line, silently stopping sitemap submission.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Run `node scripts/robots-live-guard.mjs` locally to see which",
                "check failed. This issue is closed automatically on the next",
                "passing run.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-robots-live";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open robots-live alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed robots-live alert issue #${issue.number}.`);
            }

  sweep-traces:
    # Always the LAST job. Every QA job above creates reserved-prefix
    # (qa_*) throwaway accounts, and admin erasures write one-way
    # removalLog rows — so a QA run can otherwise leave test data on the
    # live deployment. This sweep erases any straggler accounts and purges
    # the test entries from the audit log, enforcing "never keep test stuff
    # on the site" after every nightly/manual run.
    name: Sweep test traces (accounts + removal log)
    env:
      TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
    needs:
      - auth-loop
      - cloudinary-upload
      - phishing-scan
      - blocklist-sync
      - moderation-reinstate
      - story-views-qa
      - blocklist-qa
    # Run even when a peer QA FAILED — a crashed job is exactly when a
    # straggler qa_ account is most likely left behind. (Without this,
    # GitHub skips a dependent job whenever one of its needs fails.)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sweep test users + purge test removal-log entries
        if: env.TEST_HARNESS_SECRET != ''
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://outgoing-seal-727.convex.cloud' }}
        run: bash scripts/retry-once.sh sweep-traces.log npm run qa:cleanup-test-users

      - name: Upload the sweep log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-traces-log
          path: sweep-traces.log

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-sweep-traces";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test-trace sweep failed (${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The nightly test-trace sweep (cleanup-test-users + removal-log purge) failed.",
                "QA test accounts or test removal-log entries may still be on the production deployment.",
                "Run `TEST_HARNESS_SECRET=<secret> npm run qa:cleanup-test-users` locally to inspect and clean.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-sweep-traces";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open sweep alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed sweep alert issue #${issue.number}.`);
            }
