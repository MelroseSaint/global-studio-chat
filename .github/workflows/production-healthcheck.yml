                "",
                "This means one of the guarantees broke: the author's viewer list may",
                "not sort newest-first, re-views may create duplicate rows, or a",
                "non-author may be able to see who viewed a story.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the story-views-qa-log artifact for the failing check.",
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: ${{ success() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-story-views";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open story-views alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed story-views alert issue #${issue.number}.`);
            }

  blocklist-qa:
    # Serialized AFTER blocklist-sync (needs:) — the QA registers its own
    # transient qa-feed-* test sources, and the sync refreshes every enabled
    # source, so a parallel run would let the sync pick up the QA's live test
    # feed (a documented 10/11 flake from this exact race). Running them in
    # order keeps the nightly gate deterministic.
    needs: blocklist-sync
    # The blocklist engine's full 54-check QA against production:
    # scripts/blocklist-qa.mjs seeds the core adult list, adds a domain and
    # asserts it blocks across every surface, verifies IDN->punycode and
    # obfuscation handling (notonlyfans.com must NOT match, subdomains must),
    # follows redirect chains to the final host, syncs an external source,
    # and asserts cleanup leaves the deployment pristine. Runs nightly on the
    # same schedule as the auth loop — so the TLD/obfuscation guarantees and
    # the feed lifecycle are asserted against the LIVE deployment every 24h,
    # not just on push (static-audit only checks the feed files match the
    # code list; it never runs the engine against production). Harness-gated
    # (TEST_HARNESS_SECRET) like the phishing and sync jobs; skipped on
    # repositories that haven't configured the harness yet.
    name: Blocklist engine QA (54 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the blocklist engine QA
        if: ${{ secrets.TEST_HARNESS_SECRET != '' }}
        id: blocklist-qa
        env:
          # The harness secret must match the deployment env (TEST_HARNESS_SECRET)
          # with TEST_HARNESS_ENABLED=1 set on the Convex deployment.
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://outgoing-seal-727.convex.cloud' }}
        run: |
          set -o pipefail
          npm run qa:blocklist 2>&1 | tee blocklist-qa.log

      - name: Upload the blocklist QA log
        if: ${{ failure() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: blocklist-qa-log
          path: blocklist-qa.log

      # Same deduplicated-alert pattern as the other jobs, with its own label
      # so a blocklist regression doesn't piggyback on another job's alert.
      - name: Alert on failure
        if: ${{ failure() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-blocklist-qa";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blocklist engine QA failed (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The blocklist-engine QA (54 checks) failed against production.",
                "",
                "This means the domain-blocking layer is broken: a blocked domain",
                "may be slipping through, an obfuscation/IDN case may regress,",
                "or the feed lifecycle (sync/cleanup) may be leaving stale state.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the blocklist-qa-log artifact for the failing check.",
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: ${{ success() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-blocklist-qa";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open blocklist QA alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed blocklist QA alert issue #${issue.number}.`);
            }

  sweep-traces:
    # Always the LAST job. Every QA job above creates reserved-prefix
    # (qa_*) throwaway accounts, and admin erasures write one-way
    # removalLog rows — so a QA run can otherwise leave test data on the
    # live deployment. This sweep erases any straggler accounts and purges
    # the test entries from the audit log, enforcing "never keep test stuff
    # on the site" after every nightly/manual run.
    name: Sweep test traces (accounts + removal log)
    needs:
      - auth-loop
      - cloudinary-upload
      - phishing-scan
      - blocklist-sync
      - moderation-reinstate
      - story-views-qa
      - blocklist-qa
    # Run even when a peer QA FAILED — a crashed job is exactly when a
    # straggler qa_ account is most likely left behind. (Without this,
    # GitHub skips a dependent job whenever one of its needs fails.)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sweep test users + purge test removal-log entries
        if: ${{ secrets.TEST_HARNESS_SECRET != '' }}
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://outgoing-seal-727.convex.cloud' }}
        run: |
          set -o pipefail
          npm run qa:cleanup-test-users 2>&1 | tee sweep-traces.log

      - name: Upload the sweep log
        if: ${{ failure() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-traces-log
          path: sweep-traces.log

      - name: Alert on failure
        if: ${{ failure() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-sweep-traces";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test-trace sweep failed (${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The nightly test-trace sweep (cleanup-test-users + removal-log purge) failed.",
                "QA test accounts or test removal-log entries may still be on the production deployment.",
                "Run `TEST_HARNESS_SECRET=<secret> npm run qa:cleanup-test-users` locally to inspect and clean.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: ${{ success() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-sweep-traces";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open sweep alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed sweep alert issue #${issue.number}.`);
            }
