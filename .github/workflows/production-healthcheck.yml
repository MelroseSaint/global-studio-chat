name: Production Health Check

# Runs the full sign-up + password-reset auth loop against the live site
# (scripts/signup-e2e-prod.mjs). Runs on every push to `main` — so a bad
# deploy or a breaking change alerts immediately instead of waiting until
# the nightly run — plus once a night at 03:00 UTC to catch anything the
# push-triggered runs missed. Also runnable manually from the Actions tab.
on:
  push:
    branches:
      - main
  schedule:
    # Nightly at 03:00 UTC — well outside usual deploy windows.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      # A deep audit on demand: sample EVERY post and profile in the live
      # sitemap instead of the default 8-per-class (up to 1000 + 1000).
      full_sweep:
        description: "Full sitemap sweep (all posts + profiles)"
        type: boolean
        default: false

concurrency:
  # Never overlap runs: if the previous one is still going (slow email
  # delivery, etc.), the new run waits rather than piling up.
  group: production-healthcheck
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open a deduplicated alert issue when a check fails

jobs:
  auth-loop:
    name: Sign-up + reset auth loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the production auth-loop E2E
        id: e2e
        env:
          # The Resend key is required — the script reads the OTP codes from
          # Resend's API. Add it under Settings > Secrets > Actions.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Overridable via repository variables; default to production.
          SITE_URL: ${{ vars.SITE_URL || 'https://outgoing-seal-727.convex.site' }}
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://outgoing-seal-727.convex.cloud' }}
        run: bash scripts/retry-once.sh healthcheck.log npm run qa:signup-e2e

      - name: Upload the E2E log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-log
          path: healthcheck.log

      # SEO basics guard: every URL-bearing meta tag on the live homepage
      # must resolve to the EXPECTED_SITE_URL host (never the Convex
      # static-hosting mirror or a stale VITE_SITE_URL dashboard var), the
      # OG locale must be present, and robots.txt + the XML sitemap must be
      # served. A regression here is silent, so it fails the job and the
      # alert step below opens an issue.
      - name: SEO basics guard (canonical host, OG tags, robots, sitemap)
        env:
          # The one true host. Bump this here when a custom domain lands
          # (and the PUREWIRE_SITE_URL default in vite.config.ts).
          EXPECTED_SITE_URL: https://purewire.vercel.app
        run: |
          set -euo pipefail
          html="$(curl -fsSL "$EXPECTED_SITE_URL/")"
          for tag in \
            'rel="canonical" href="' \
            'property="og:url" content="' \
            'property="og:image" content="' \
            'name="twitter:image" content="' \
            '"url": "' ; do
            echo "$html" | grep -qF "${tag}${EXPECTED_SITE_URL}" \
              || { echo "::error::tag '${tag}' does not resolve to $EXPECTED_SITE_URL"; exit 1; }
          done
          echo "$html" | grep -q 'property="og:locale"' \
            || { echo "::error::og:locale meta is missing"; exit 1; }
          curl -fsSL "$EXPECTED_SITE_URL/robots.txt" | grep -qi "sitemap:" \
            || { echo "::error::robots.txt is not served"; exit 1; }
          curl -fsSL "$EXPECTED_SITE_URL/sitemap.xml" | grep -q "<urlset" \
            || { echo "::error::sitemap.xml is not served"; exit 1; }
          echo "SEO basics OK: canonical + OG/twitter tags on $EXPECTED_SITE_URL"

      # Sitemap URL health: the dynamic sitemap only earns its place if the
      # URLs it submits actually render. Sample the newest posts + profiles
      # (plus the fixed pages) and assert each returns 200 with REAL content
      # — server-rendered Article/ProfilePage JSON-LD for posts/profiles,
      # never a 404 or the SPA shell — so a visibility regression can never
      # silently submit dead URLs. A failure here fails the job and opens
      # the alert issue below.
      - name: Sitemap URL health (sampled posts + profiles)
        run: |
          if [ "${{ github.event.inputs.full_sweep }}" = "true" ]; then
            npm run qa:sitemap-urls:all
          else
            npm run qa:sitemap-urls
          fi

      # Dynamic rendering guard: a Googlebot fetch of the newest /post/:id
      # and /u/:handle must return the server-rendered OG page (Article /
      # ProfilePage JSON-LD) — never the SPA shell — while a plain browser
      # must still get the SPA. A regression here means search engines see
      # a blank app and every OG/JSON-LD investment is dead (or the reverse:
      # browsers get a non-interactive page). Fails the job and opens the
      # alert issue below, on every push to main + nightly.
      - name: Dynamic rendering guard (Googlebot vs browser)
        run: npm run qa:dynamic-render

      # Alerting: GitHub already emails on failed runs. This also opens a
      # single persistent issue (label prod-healthcheck) so a failing nightly
      # check is visible on the repo and never silently lost — and never
      # spams one issue per night, because an open alert blocks a new one.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-healthcheck";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production health check failed (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "A PureWire production check failed against the live site.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the run log (healthcheck-log artifact) for the failing check.",
                "The throwaway account, if one was left behind, is named in the log.",
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      # Self-healing: when a run passes, close any open alert issue so the
      # next real failure can open a fresh one instead of being swallowed by
      # a stale alert.
      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-healthcheck";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed alert issue #${issue.number}.`);
            }

  vercel-env-guard:
    # The canonical host is repo-owned by construction: vite.config.ts
    # defaults to it and the dashboard self-documents it via
    # PUREWIRE_SITE_URL. The stale VITE_SITE_URL var was the original
    # source of the wrong-host bug, so this guard fails the job if it EVER
    # reappears in any Vercel environment — and asserts PUREWIRE_SITE_URL
    # is still set in production — so a dashboard edit can never silently
    # re-open the defect. Uses the same VERCEL_TOKEN secret as the Deploy
    # workflow (scripts/vercel-env-guard.mjs).
    name: Vercel env guard (no stale VITE_SITE_URL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the Vercel env guard
        if: env.VERCEL_TOKEN != ''
        run: npm run qa:vercel-env

      # Same deduplicated-alert pattern as the other jobs, with its own
      # label so a reintroduced stale var gets its own visible alert.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-vercel-env";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Stale VITE_SITE_URL detected in Vercel env (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The Vercel env guard failed against the project's environment variables.",
                "",
                "This means **VITE_SITE_URL was re-added to the Vercel project env**, or",
                "**PUREWIRE_SITE_URL is no longer set in production**. The canonical host",
                "is repo-owned by construction — the stale var re-opens the wrong-host",
                "defect and re-emits the build warning.",
                "",
                "Fix: remove VITE_SITE_URL from every Vercel environment (Settings →",
                "Environment Variables) and ensure PUREWIRE_SITE_URL=https://purewire.vercel.app",
                "exists in production.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-vercel-env";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open Vercel env alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed Vercel env alert issue #${issue.number}.`);
            }

  vercel-build-warnings:
    # The env guard proves the stale VITE_SITE_URL var is absent from the
    # dashboard — but a dashboard edit between runs can re-add it, and the
    # only place its damage shows up is the Vercel BUILD LOG, where
    # vite.config.ts's siteUrl() plugin prints `[purewire-site-url]
    # VITE_SITE_URL is set but ignored`. This job is the log-level twin of
    # the env guard: it finds the deployment for THIS commit (git SHA, or
    # the newest deploy of the last 20 min) for EACH target — production
    # and preview — waits for the build to finish, fetches the deployment
    # events (the build log), and fails if `VITE_SITE_URL is set but
    # ignored` or any other `[purewire-site-url]` warning appears. Preview
    # builds share vite.config.ts and the dashboard env, so a stale var
    # sitting in the preview environment prints the same warning there —
    # scanning both targets proves the canonical host is correct in every
    # shipped bundle, not just the dashboard (scripts/vercel-build-warnings.mjs
    # with VERCEL_TARGET=production|preview). Runs on the same schedule as
    # the env guard; skips when VERCEL_TOKEN is not configured.
    name: Vercel build-log warning guard (prod + preview, no purewire-site-url warnings)
    runs-on: ubuntu-latest
    # Two scans run sequentially (production, then preview); each worst
    # case is find (2 min) + ready poll (10 min), so 40 keeps comfortable
    # margin over two slow builds without killing the guard mid-poll.
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan the production build log
        id: scan-prod
        if: env.VERCEL_TOKEN != ''
        run: npm run qa:vercel-build-warnings

      - name: Scan the latest preview build log
        id: scan-preview
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TARGET: preview
        run: npm run qa:vercel-build-warnings

      # Same deduplicated-alert pattern as the other jobs, with its own
      # label per target so a build-log warning (stale VITE_SITE_URL var
      # or any esbuild/Vite warning) gets a visible alert for the exact
      # environment that emitted it. The `steps.<id>.outcome` guards keep
      # the two alerts independent — a preview-only warning never opens
      # (or closes) a production alert and vice versa. (Intentional
      # difference from the `failure()`-guarded jobs: per-step guards mean
      # an infra failure like checkout/setup-node no longer opens an
      # alert — only the scans themselves do.)
      - name: Alert on production failure
        if: steps.scan-prod.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-build-warnings";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `build-log warning (purewire-site-url or esbuild/Vite) in the production build (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The Vercel build-log warning guard failed against the live deployment's build log.",
                "",
                "This means the production build emitted a warning, which a clean build never does.",
                "",
                "- **purewire-site-url**: `VITE_SITE_URL is set but ignored` (or another",
                "  `[purewire-site-url]` line) — the stale var was re-added to a Vercel",
                "  environment, or the canonical-host plugin in vite.config.ts is misconfigured.",
                "  The shipped bundle then carries the wrong canonical/OG host, re-opening the",
                "  cross-host duplicate-content defect. Fix: remove VITE_SITE_URL from every",
                "  Vercel environment and keep PUREWIRE_SITE_URL=https://purewire.vercel.app set.",
                "",
                "- **esbuild/Vite warning** (e.g. `[esbuild css minify]`, chunk-size advisory, eval,",
                "  sourcemap, or circular-dependency warning) — an unknown CSS property or other",
                "  bundle defect slipped into the build. Fix at the source: vite.config.ts's esbuild",
                "  logOverride or the offending dependency, so the log is 100% warning-free again.",
                "",
                "See the workflow log for the exact warning line(s) that tripped the guard.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale production alert on success
        if: steps.scan-prod.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-build-warnings";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open build-warnings alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed build-warnings alert issue #${issue.number}.`);
            }

      - name: Alert on preview failure
        if: steps.scan-preview.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "preview-build-warnings";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `build-log warning (purewire-site-url or esbuild/Vite) in a preview build (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The Vercel build-log warning guard failed against a preview deployment's build log.",
                "",
                "This means a preview build emitted a warning, which a clean build never does.",
                "",
                "- **purewire-site-url**: `VITE_SITE_URL is set but ignored` (or another",
                "  `[purewire-site-url]` line) — the stale var sits in the Vercel preview",
                "  environment, or the canonical-host plugin in vite.config.ts is misconfigured.",
                "  Preview bundles then carry the wrong canonical/OG host; production is unaffected",
                "  but the defect will ship the moment the preview branch merges.",
                "",
                "- **esbuild/Vite warning** (e.g. `[esbuild css minify]`, chunk-size advisory, eval,",
                "  sourcemap, or circular-dependency warning) — an unknown CSS property or other",
                "  bundle defect slipped into the preview build and will ship on merge. Fix at the",
                "  source so the log is 100% warning-free again.",
                "",
                "See the workflow log for the exact warning line(s) that tripped the guard.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale preview alert on success
        if: steps.scan-preview.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "preview-build-warnings";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open preview build-warnings alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed preview build-warnings alert issue #${issue.number}.`);
            }

  cloudinary-upload:
    # Proves the unsigned-preset upload path works (the exact call the
    # browser makes) by uploading a 1x1 PNG and destroying it. Catches a
    # missing/renamed preset, a revoked key, or a quota block the moment it
    # happens — before every user upload breaks silently. Runs in parallel
    # with the auth loop, same schedule, own alert label.
    name: Cloudinary upload health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the Cloudinary upload probe
        id: probe
        env:
          # Add these under Settings > Secrets > Actions. The cloud name and
          # preset can come from repository variables instead; the API key +
          # secret are only used to destroy the probe asset afterward.
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME || secrets.CLOUDINARY_CLOUD_NAME || 'saintscloud' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET || secrets.CLOUDINARY_UPLOAD_PRESET || 'purewire_unsigned' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: bash scripts/retry-once.sh cloudinary-health.log npm run qa:cloudinary-health

      - name: Upload the probe log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudinary-health-log
          path: cloudinary-health.log

      # Same deduplicated-alert pattern as the auth loop, with its own label
      # so a media outage doesn't piggyback on (or get swallowed by) the
      # auth-loop alert.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-cloudinary";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Cloudinary uploads are down (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The Cloudinary unsigned-preset upload probe failed against production.",
                "",
                "This means **every user upload is failing** — the app falls back to Convex",
                "storage, but media should live in Cloudinary.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the cloudinary-health-log artifact for the probe output.",
                "",
                "Common causes:",
                "- The unsigned upload preset was deleted or renamed (Settings → Upload → Upload Presets).",
                "- The Cloudinary API key was revoked or the account was suspended.",
                "- A quota or storage limit was hit.",
                "",
                "This issue is closed automatically on the next passing run.",
              ].join("\n"),
            });

      - name: Close stale alert on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-cloudinary";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length === 0) {
              console.log("No open Cloudinary alert issue to close.");
              return;
            }
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed Cloudinary alert issue #${issue.number}.`);
            }

  phishing-scan:
