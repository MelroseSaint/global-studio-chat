            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blocklist feed sync failed (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
                "The external blocklist feed sync failed against production.",
                "",
                "This means one or more enabled sources (the data/adult feeds or",
                "an admin-added source) did not refresh — new domains are not",
                "being added and vanished domains are not being deactivated.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the blocklist-sync-log artifact for which source failed.",
