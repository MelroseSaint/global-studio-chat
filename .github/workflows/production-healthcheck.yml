                "  (someone reverted the ConvexError wrapping or the admin gate).",
                "- The query errored even after a fresh backend IP verification",
                "  (requireAdmin / assertAdminIpVerified broken).",
                "- A browser load of /admin with an admin session rendered the",
                "  router error page or the app fallback instead of the shell",
                "  (the route-level errorElement or workload boundary regressed).",
                "",
                `Triggered by: ${via}`,
