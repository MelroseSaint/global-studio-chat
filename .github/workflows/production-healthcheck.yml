  blocklist-sync:
    # Scheduled blocklist refresh + bootstrap: the script first runs
    # registerDefaultBlocklistSources (the self-healing bootstrap that
    # re-inserts the built-in PureWire data/adult feeds if they were ever
    # removed), then runs syncExternalSources against production so every
    # enabled external feed refreshes on the spec's 24h cadence — the action
    # validates, normalizes, dedupes, adds new domains, deactivates domains
    # that vanished from their feed, and records lastVerifiedAt + the sync
    # timestamp for traceability. Runs nightly (plus every push + manual),
    # harness-gated like the other jobs. A source error fails the job so a
    # broken feed is visible instead of silently stale.
    name: Blocklist feed sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the blocklist sync
        if: ${{ secrets.TEST_HARNESS_SECRET != '' }}
        id: sync
        env:
          TEST_HARNESS_SECRET: ${{ secrets.TEST_HARNESS_SECRET }}
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://outgoing-seal-727.convex.cloud' }}
        run: |
          set -o pipefail
          npm run qa:blocklist-sync 2>&1 | tee blocklist-sync.log

      - name: Upload the sync log
        if: ${{ failure() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: blocklist-sync-log
          path: blocklist-sync.log

      # Same deduplicated-alert pattern as the other jobs, with its own label
      # so a stale/breaking feed doesn't piggyback on another job's alert.
      - name: Alert on failure
        if: ${{ failure() && secrets.TEST_HARNESS_SECRET != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-blocklist";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
