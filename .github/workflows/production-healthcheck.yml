        uses: actions/github-script@v7
        with:
          script: |
            const label = "prod-admin-workload";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.length > 0) {
              console.log(`Alert issue already open: #${open[0].number} — keeping it.`);
              return;
            }
            const via =
              context.eventName === "schedule" ? "nightly" :
              context.eventName === "workflow_dispatch" ? "manual" :
              `push to ${context.ref.replace("refs/heads/", "")}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Admin workload crash-class regression (${via}, ${new Date().toISOString()})`,
              labels: [label],
              body: [
