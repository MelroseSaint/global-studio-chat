              body: [
                "The phishing & account-integrity QA failed against production.",
                "",
                "This means the scanner or its wiring is broken: scam links or",
                "credential-harvesting phrasing may be slipping through, or",
                "genuine links may be getting blocked or review-queued.",
                "",
                `Triggered by: ${via}`,
                `Commit: ${context.sha.slice(0, 12)} (${context.ref})`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
